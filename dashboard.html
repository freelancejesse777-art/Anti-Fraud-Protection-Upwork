<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Postcheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<style>
  .confirm-card{
    display: none;
    border: 1px solid rgba(62,124,89,0.4);
    background: linear-gradient(180deg, rgba(62,124,89,0.12), rgba(62,124,89,0.03));
    border-radius: 14px;
    padding: 36px;
    text-align: center;
    margin-bottom: 32px;
  }
  .confirm-icon{
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--safe);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .confirm-icon svg{ width: 24px; height: 24px; }
  .confirm-card h2{ font-size: 22px; margin-bottom: 8px; }
  .confirm-card p{ font-size: 13.5px; color: rgba(233,230,220,0.65); max-width: 420px; margin: 0 auto 22px; line-height: 1.6; }
  .confirm-plan-tag{
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    background: rgba(18,26,30,0.5); border: 1px solid rgba(233,230,220,0.15);
    padding: 7px 14px; border-radius: 999px; margin-bottom: 24px;
  }
  .confirm-plan-tag .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--safe); }
  .confirm-steps{
    display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
    text-align: left; margin-bottom: 6px;
  }
  .confirm-step{
    flex: 1; min-width: 180px; max-width: 220px;
    background: var(--ink); border: 1px solid rgba(233,230,220,0.1);
    border-radius: 10px; padding: 16px;
  }
  .confirm-step .num{ font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--steel); margin-bottom: 8px; display: block; }
  .confirm-step p{ font-size: 12.5px; color: rgba(233,230,220,0.7); margin: 0; text-align: left; max-width: none; }
  .dash-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 28px; flex-wrap:wrap; gap:12px; }
  .plan-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 20px; }
  .install-note{ font-size:13px; color: rgba(233,230,220,0.55); line-height:1.7; }
  .install-note code{ font-family:'IBM Plex Mono',monospace; background: var(--ink); padding: 2px 6px; border-radius:4px; font-size:12px; }
  .loading{ text-align:center; padding: 80px 0; color: rgba(233,230,220,0.5); font-family:'IBM Plex Mono',monospace; font-size:12px; }
</style>
</head>

</nav>
